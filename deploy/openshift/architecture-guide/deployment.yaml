apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-architecture-guide
  labels:
    app.kubernetes.io/name: loan-architecture-guide
    app.kubernetes.io/part-of: mortgage-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-architecture-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-architecture-guide
        app.kubernetes.io/part-of: mortgage-ai
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/sbin/nginx
          args:
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: site
              mountPath: /opt/app-root/src/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: loan-architecture-guide
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: loan-architecture-guide
  labels:
    app.kubernetes.io/name: loan-architecture-guide
    app.kubernetes.io/part-of: mortgage-ai
spec:
  selector:
    app.kubernetes.io/name: loan-architecture-guide
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: loan-architecture-guide
  labels:
    app.kubernetes.io/name: loan-architecture-guide
    app.kubernetes.io/part-of: mortgage-ai
spec:
  to:
    kind: Service
    name: loan-architecture-guide
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
